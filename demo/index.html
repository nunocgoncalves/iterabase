<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Iterabase guided product demo</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="/assets/fonts.css">
  <style>:root{--gph-25:#F6F8FA;--bg:var(--gph-25);--font-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}html,body{margin:0;height:100%;background:var(--bg);font-family:var(--font-sans)}</style>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
      <rect width="320" height="200" fill="#0b0e14"/>
      <g transform="translate(96 60)" fill="none" stroke="#2f6bff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h34l20 28"/><path d="M4 40h40"/><path d="M4 74h34l20-28"/><path d="M58 40h30"/>
        <circle cx="104" cy="40" r="14" fill="#2f6bff" stroke="none"/>
        <path d="M99 40l4 4 7-8" stroke="#0b0e14" stroke-width="4"/>
      </g>
    </svg>
  </template>
</helmet>
<div style="height:100vh;width:100%;overflow:hidden">
  <dc-import name="Agent Work Management v3" autoplay="{{ true }}" language="{{ language }}" user-name="{{ userName }}" company-name="{{ companyName }}" scope-v2="{{ scopeV2 }}" role="{{ role }}" hint-size="100%,100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;language&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;pt&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Localization&quot;},&quot;scopeV2&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype state&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;operator&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype state&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pedro Santos&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Signed-in user&quot;},&quot;companyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;XBS Log&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Signed-in user&quot;}}"></script>
</body>
</html>
